# Add materials here after reviewing links and student instructions.
# Keys match the filenames in _teaching/, without .md.
# Sections only appear when there are items to share.

learning-and-memory:
  note: "These are working versions. I am revising them to provide consistent student instructions, instructor notes, and supporting materials."
  items:
    - title: "Interactive Learning and Memory labs (working collection)"
      url: "https://github.com/keithwylie/learning"
      type: "Original teaching materials"
      description: "Browser-based activities on conditioning, generalization, skill learning, memory phenomena, and related topics. Individual labs will be linked after standardization."

science-of-learning:
  layout: downloads
  items:
    - title: "Do Students Practice Retrieval?"
      description: "An early, guided reading of Karpicke, Butler, and Roediger's research on students' study strategies. Students work through the article section by section and connect the findings to their own habits."
      pdf: "/assets/pdf/02ResearchFridayKarpicke.pdf"
      word: "/assets/pdf/02ResearchFridayKarpicke.docx"
    - title: "The Pen Is Mightier Than the Keyboard"
      version: "Original Research Brief"
      description: "My first version of the note-taking assignment, based on Mueller and Oppenheimer (2014). Students analyze the article and locate a follow-up study to see how later research engages with its findings."
      pdf: "/assets/pdf/02ResearchBriefMuellerOppenheimer.pdf"
      word: "/assets/pdf/02ResearchBriefMuellerOppenheimer.docx"
    - title: "The Pen Is Mightier Than the Keyboard"
      version: "Research Friday V2"
      description: "A revised worksheet with more guidance through the original study's methods and findings, followed by reflection on note-taking strategies."
      pdf: "/assets/pdf/02ResearchFridayMuellerOppenheimerV2.pdf"
      word: "/assets/pdf/02ResearchFridayMuellerOppenheimerV2.docx"
    - title: "Spacing and Interleaving in the Real World"
      description: "Students find a study of spaced or interleaved practice outside psychology, then connect it to the learning strategies discussed in Make It Stick."
      pdf: "/assets/pdf/05ResearchFridaySpacingInterleaving.pdf"
      word: "/assets/pdf/05ResearchFridaySpacingInterleaving.docx"
    - title: "When Is Difficulty Desirable?"
      description: "Students compare two sources on desirable difficulties, considering when added difficulty might help learning and when it could get in the way."
      pdf: "/assets/pdf/06ResearchFridayDesirableDifficulty.pdf"
      word: "/assets/pdf/06ResearchFridayDesirableDifficulty.docx"
    - title: "Reheating Dunning–Kruger's Nachos"
      description: "Students read the original Kruger and Dunning research alongside a more recent study, then consider how scientific conclusions change and develop."
      pdf: "/assets/pdf/07ResearchFridayDunningKruger.pdf"
      word: "/assets/pdf/07ResearchFridayDunningKruger.docx"
    - title: "Learning Styles"
      description: "Students find a recent empirical study of learning styles, evaluate its methods and findings, and compare what they found with a classmate."
      pdf: "/assets/pdf/08ResearchFridayLearningStyles.pdf"
      word: "/assets/pdf/08ResearchFridayLearningStyles.docx"
    - title: "Motivation"
      description: "Students locate research on motivation and learning strategies, consider how the two interact, and compare their findings with a peer."
      pdf: "/assets/pdf/09ResearchFridayMotivation.pdf"
      word: "/assets/pdf/09ResearchFridayMotivation.docx"

research-methods:
  note: "Open tools and instructional resources I use in research methods courses."
  items:
    - title: "jamovi"
      url: "https://www.jamovi.org/"
      type: "Statistical software"
      description: "Free software for statistical analyses and visualization."
    - title: "Learning Statistics with jamovi"
      url: "https://learningstatisticswithjamovi.com/"
      type: "Open textbook"
      description: "A freely available introduction to statistical reasoning and analysis."
    - title: "Open Stats Lab"
      url: "https://sites.trinity.edu/osl"
      type: "Open educational resource"
      description: "Applied statistics labs and accompanying activities."
